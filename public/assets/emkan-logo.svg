<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 62" fill="none">
  <!-- Emkan Logo Mark -->
  <g stroke="#00B5A5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top vertical loop -->
    <path d="M 28 29 C 28 17, 39 17, 39 29 C 39 39, 28 41, 28 41" />
    <!-- Left loop -->
    <path d="M 29 28 C 17 28, 17 39, 29 39 C 39 39, 41 28, 41 28" />
    <!-- Bottom right loop -->
    <path d="M 29 40 C 29 52, 40 52, 40 40 C 40 30, 29 29, 29 29" />
  </g>
  <!-- Arabic wordmark: إمكان -->
  <text x="68" y="27" font-family="'Cairo', 'Tajawal', sans-serif" font-size="22" font-weight="900" fill="#1E2050">إمكـان</text>
  <!-- English wordmark: EMKAN -->
  <text x="69" y="47" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="15" font-weight="900" fill="#1E2050" letter-spacing="1.5">EMK<tspan letter-spacing="0">N</tspan></text>
</svg>
