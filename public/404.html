<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة 404 | مركز رابا للتأهيل وتحليل السلوك التطبيقي</title>
  <meta name="robots" content="noindex, follow">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0D1B2A;
      color: #ffffff;
      text-align: center;
      padding: 24px;
      direction: rtl;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 24px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
    }
    h1 {
      font-size: 4rem;
      margin: 0 0 10px 0;
      color: #2E86EB;
      font-weight: 900;
    }
    h2 {
      font-size: 1.5rem;
      margin: 0 0 12px 0;
      font-weight: 800;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 0 0 24px 0;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(90deg, #2E86EB, #22C55E);
      color: #ffffff;
      text-decoration: none;
      font-weight: 800;
      padding: 12px 32px;
      border-radius: 9999px;
      transition: transform 0.2s;
    }
    a:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <h2>الصفحة المطلوبة غير موجودة</h2>
    <p>نعتذر منك، الصفحة أو الرابط الذي تبحث عنه غير متوفر أو تم نقله إلى موقع آخر.</p>
    <a href="/">العودة إلى الصفحة الرئيسية</a>
  </div>
</body>
</html>
