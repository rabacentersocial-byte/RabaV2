<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_fahad_juhani" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Circle with Soft Medical Glow -->
  <rect width="400" height="400" rx="200" fill="url(#grad_fahad_juhani)" filter="url(#shadow)"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.2"/>
  <circle cx="200" cy="200" r="165" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>

  
        <!-- Male Doctor Silhouette -->
        <circle cx="200" cy="185" r="55" fill="#ffffff" opacity="0.95"/>
        <path d="M110 370 C110 300 150 265 200 265 C250 265 290 300 290 370 C280 380 250 390 200 390 C150 390 120 380 110 370 Z" fill="#ffffff" opacity="0.95"/>
        <!-- Stethoscope & Coat -->
        <path d="M175 270 L200 325 L225 270 Z" fill="#0891b2" opacity="0.9"/>
        <path d="M165 290 Q150 330 180 350" stroke="#e2e8f0" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M235 290 Q250 330 220 350" stroke="#e2e8f0" stroke-width="4" fill="none" stroke-linecap="round"/>
        <circle cx="200" cy="350" r="8" fill="#38bdf8"/>
        

  <!-- Floating Medical Verification Shield Badge -->
  <g transform="translate(285, 45)">
    <circle cx="24" cy="24" r="22" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="3"/>
    <path d="M15 24 L21 30 L33 18" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Bottom Name & Specialization Tag -->
  <g transform="translate(200, 360)">
    <rect x="-110" y="-28" width="220" height="38" rx="19" fill="#0f172a" fill-opacity="0.88" stroke="#ffffff" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" fill="#ffffff" font-size="14" font-family="'Segoe UI', Tajawal, Cairo, sans-serif" font-weight="bold">فهد الجهني</text>
  </g>
</svg>