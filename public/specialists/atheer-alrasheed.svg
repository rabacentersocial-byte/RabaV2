<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 675 900" width="675" height="900">
  <defs>
    <linearGradient id="cardGrad_atheer-alrasheed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0b1e36"/>
    </linearGradient>
    <linearGradient id="pillGrad_atheer-alrasheed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5BE"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid_atheer-alrasheed" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8f0" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <filter id="glow_atheer-alrasheed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas with Grid -->
  <rect width="675" height="900" fill="#ffffff" rx="36"/>
  <rect width="675" height="900" fill="url(#grid_atheer-alrasheed)" rx="36"/>

  <!-- Logo Top Left -->
  <g transform="translate(60, 48)">
    <g transform="translate(0, 0)">
      <path d="M 12 12 Q 22 4 32 12 Q 40 22 32 32 Q 22 40 12 32 Z" fill="#00E5BE"/>
      <path d="M 28 8 Q 36 2 44 8 Q 50 18 44 26 Q 36 32 28 26 Z" fill="#f43f5e" opacity="0.9"/>
      <path d="M 24 24 Q 32 18 40 24 Q 46 34 40 42 Q 32 48 24 42 Z" fill="#fbbf24" opacity="0.95"/>
    </g>
    <text x="64" y="24" fill="#0369a1" font-size="24" font-weight="900" font-family="sans-serif" letter-spacing="1">RABA</text>
    <text x="64" y="44" fill="#0f766e" font-size="14" font-weight="bold" font-family="sans-serif">مركز رابا للرعاية النهارية</text>
  </g>

  <!-- Blue Curved Container Card -->
  <rect x="52" y="185" width="571" height="665" rx="36" fill="url(#cardGrad_atheer-alrasheed)"/>

  <!-- Wave lines decoration in container -->
  <path d="M 52 300 Q 195 270 337 300 T 623 300" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M 52 320 Q 195 290 337 320 T 623 320" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.2"/>
  <path d="M 52 340 Q 195 310 337 340 T 623 340" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.1"/>

  <!-- Circular Avatar Area with Neon Ring -->
  <circle cx="337" cy="265" r="132" fill="#00E5BE" opacity="0.3" filter="url(#glow_atheer-alrasheed)"/>
  <circle cx="337" cy="265" r="126" fill="#0f172a" stroke="#00E5BE" stroke-width="5"/>
  <g clip-path="url(#circleClip_atheer-alrasheed)">
    <clipPath id="circleClip_atheer-alrasheed">
      <circle cx="337" cy="265" r="122"/>
    </clipPath>
    <!-- Background inside avatar circle -->
    <rect x="200" y="130" width="274" height="274" fill="#0284c7" opacity="0.4"/>
    
      <!-- Niqab silhouette -->
      <path d="M 280 200 C 280 140, 394 140, 394 200 C 394 280, 415 380, 415 390 L 259 390 C 259 380, 280 280, 280 200 Z" fill="#0f172a"/>
      <!-- Eyes slit -->
      <path d="M 305 195 Q 337 205 369 195 Q 369 180 337 180 Q 305 180 305 195 Z" fill="#fde68a"/>
      <ellipse cx="323" cy="190" rx="6" ry="3.5" fill="#1e293b"/>
      <ellipse cx="351" cy="190" rx="6" ry="3.5" fill="#1e293b"/>
      <!-- White coat -->
      <path d="M 240 390 L 290 280 L 337 360 L 384 280 L 434 390 Z" fill="#ffffff" opacity="0.95"/>
    
  </g>

  <!-- Accent Arc around Avatar -->
  <path d="M 215 285 A 126 126 0 0 1 235 210" stroke="#f43f5e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 460 285 A 126 126 0 0 0 440 210" stroke="#f43f5e" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Doctor Name in Big Gold Typography -->
  <text x="337" y="455" text-anchor="middle" fill="#fbbf24" font-size="44" font-weight="900" font-family="system-ui, -apple-system, sans-serif">اثير آل رشيد</text>

  <!-- Title Pill -->
  <rect x="187" y="478" width="300" height="42" rx="21" fill="url(#pillGrad_atheer-alrasheed)"/>
  <text x="337" y="506" text-anchor="middle" fill="#042f2e" font-size="20" font-weight="800" font-family="system-ui, -apple-system, sans-serif">أخصائية ABA</text>

  <!-- Qualifications and Certifications -->
  
      <g transform="translate(600, 575)">
        <circle cx="12" cy="-6" r="4.5" fill="#38bdf8"/>
        <text x="-10" y="0" text-anchor="start" direction="rtl" fill="#f8fafc" font-size="18.5" font-family="system-ui, -apple-system, sans-serif" font-weight="500">حاصلة على بكالوريوس علم النفس من جامعة الإمام محمد بن سعود الاسلامية</text>
      </g>
    

      <g transform="translate(600, 610)">
        <circle cx="12" cy="-6" r="4.5" fill="#38bdf8"/>
        <text x="-10" y="0" text-anchor="start" direction="rtl" fill="#f8fafc" font-size="18.5" font-family="system-ui, -apple-system, sans-serif" font-weight="500">حاصلة على تصنيف هيئة التخصصات الصحية</text>
      </g>
    

      <g transform="translate(600, 645)">
        <circle cx="12" cy="-6" r="4.5" fill="#38bdf8"/>
        <text x="-10" y="0" text-anchor="start" direction="rtl" fill="#f8fafc" font-size="18.5" font-family="system-ui, -apple-system, sans-serif" font-weight="500">حاصلة على رخصة ABAT فني تحليل سلوك تطبيقي</text>
      </g>
    

      <g transform="translate(600, 680)">
        <circle cx="12" cy="-6" r="4.5" fill="#38bdf8"/>
        <text x="-10" y="0" text-anchor="start" direction="rtl" fill="#f8fafc" font-size="18.5" font-family="system-ui, -apple-system, sans-serif" font-weight="500">حاصلة على دورة فعالية العلاج الطبي ومدى تأثيره على ذوي إضطرابات طيف التوحد</text>
      </g>
    

      <g transform="translate(600, 715)">
        <circle cx="12" cy="-6" r="4.5" fill="#38bdf8"/>
        <text x="-10" y="0" text-anchor="start" direction="rtl" fill="#f8fafc" font-size="18.5" font-family="system-ui, -apple-system, sans-serif" font-weight="500">خبرة عملية أكثر من 3 سنوات</text>
      </g>
    

  <!-- Footer Social Bar -->
  <g transform="translate(337, 868)">
    <text x="0" y="0" text-anchor="middle" fill="#0f172a" font-size="14" font-family="sans-serif" font-weight="700">rabacenter • rabacenters.com</text>
  </g>

  <!-- Left decorative spiral ribbon -->
  <path d="M 60 760 C 20 810, 0 870, 70 940 C 130 920, 100 830, 60 760 Z" stroke="#38bdf8" stroke-width="12" fill="none" opacity="0.6"/>
</svg>