<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_aliah_mutairi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Circle with Soft Medical Glow -->
  <rect width="400" height="400" rx="200" fill="url(#grad_aliah_mutairi)" filter="url(#shadow)"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.2"/>
  <circle cx="200" cy="200" r="165" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>

  
        <!-- Female Doctor / Hijab Silhouette -->
        <path d="M200 135 C170 135 150 160 150 195 C150 235 170 255 200 255 C230 255 250 235 250 195 C250 160 230 135 200 135 Z" fill="#ffffff" opacity="0.95"/>
        <path d="M145 205 C140 260 155 305 180 320 C185 305 195 295 200 295 C205 295 215 305 220 320 C245 305 260 260 255 205 C250 150 235 125 200 125 C165 125 150 150 145 205 Z" fill="#ffffff" opacity="0.25"/>
        <path d="M120 370 C120 310 160 280 200 280 C240 280 280 310 280 370 C270 380 250 390 200 390 C150 390 130 380 120 370 Z" fill="#ffffff" opacity="0.95"/>
        <path d="M175 285 L200 330 L225 285 Z" fill="#14b8a6" opacity="0.9"/>
        

  <!-- Floating Medical Verification Shield Badge -->
  <g transform="translate(285, 45)">
    <circle cx="24" cy="24" r="22" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="3"/>
    <path d="M15 24 L21 30 L33 18" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Bottom Name & Specialization Tag -->
  <g transform="translate(200, 360)">
    <rect x="-110" y="-28" width="220" height="38" rx="19" fill="#0f172a" fill-opacity="0.88" stroke="#ffffff" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" fill="#ffffff" font-size="14" font-family="'Segoe UI', Tajawal, Cairo, sans-serif" font-weight="bold">عاليه المطيري</text>
  </g>
</svg>