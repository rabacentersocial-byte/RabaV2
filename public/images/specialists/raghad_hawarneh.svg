<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_ragha" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081726"/>
      <stop offset="50%" stop-color="#0B2538"/>
      <stop offset="100%" stop-color="#0A3432"/>
    </linearGradient>
    <linearGradient id="accent_ragha" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Modern Card Background -->
  <rect width="600" height="600" fill="url(#grad_ragha)"/>
  
  <!-- Decorative Medical Waves -->
  <path d="M 0 350 Q 150 330 300 350 T 600 350 L 600 600 L 0 600 Z" fill="#061E2E" opacity="0.6"/>
  <path d="M 0 380 Q 150 360 300 380 T 600 380 L 600 600 L 0 600 Z" fill="#041420" opacity="0.8"/>
  
  <!-- Outer Glowing Portal Ring -->
  <circle cx="300" cy="240" r="165" fill="none" stroke="url(#accent_ragha)" stroke-width="3.5" opacity="0.8" filter="url(#glow)"/>
  <circle cx="300" cy="240" r="150" fill="#0A1D2D" stroke="#1E3A52" stroke-width="2"/>
  
  <!-- Specialist Visual Illustration -->
  
        <!-- Hijab -->
        <path d="M235 180 C235 110, 365 110, 365 180 C365 240, 355 280, 335 320 L265 320 C245 280, 235 240, 235 180 Z" fill="#78350F"/>
        <!-- Face -->
        <ellipse cx="300" cy="220" rx="46" ry="52" fill="#FDE68A" opacity="0.4"/>
        <ellipse cx="280" cy="210" rx="12" ry="7" fill="#FFFFFF"/>
        <circle cx="280" cy="210" r="4" fill="#0F172A"/>
        <ellipse cx="320" cy="210" rx="12" ry="7" fill="#FFFFFF"/>
        <circle cx="320" cy="210" r="4" fill="#0F172A"/>
        <!-- Smile -->
        <path d="M285 242 Q300 255 315 242" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
        <!-- White Doctor Lab Coat -->
        <path d="M190 380 C190 315, 230 295, 300 295 C370 295, 410 315, 410 380 Z" fill="#FFFFFF"/>
        <path d="M280 295 L300 345 L320 295 Z" fill="#0F172A"/>
        <path d="M255 315 L285 380" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
        <path d="M345 315 L315 380" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
        
  
  <!-- Badge & Name Section -->
  <rect x="80" y="430" width="440" height="135" rx="24" fill="#061624" fill-opacity="0.9" stroke="#1E3A52" stroke-width="1.5"/>
  
  <!-- Name in Glowing Yellow Calligraphy -->
  <text x="300" y="478" font-family="'Almarai', 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="900" fill="#FBBF24" text-anchor="middle" letter-spacing="0.5">رغد حوارنه</text>
  
  <!-- Specialty Pill Badge -->
  <rect x="130" y="500" width="340" height="40" rx="20" fill="#0B3B36" stroke="#10B981" stroke-width="1.5"/>
  <text x="300" y="526" font-family="'Almarai', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">أخصائية العلاج الوظيفي</text>
  
  <!-- RABA Center Watermark -->
  <text x="540" y="45" font-family="sans-serif" font-size="14" font-weight="bold" fill="#00E5BE" opacity="0.5" text-anchor="end">RABA CENTER</text>
</svg>