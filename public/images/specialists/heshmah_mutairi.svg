<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_heshm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081726"/>
      <stop offset="50%" stop-color="#0B2538"/>
      <stop offset="100%" stop-color="#0A3432"/>
    </linearGradient>
    <linearGradient id="accent_heshm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Modern Card Background -->
  <rect width="600" height="600" fill="url(#grad_heshm)"/>
  
  <!-- Decorative Medical Waves -->
  <path d="M 0 350 Q 150 330 300 350 T 600 350 L 600 600 L 0 600 Z" fill="#061E2E" opacity="0.6"/>
  <path d="M 0 380 Q 150 360 300 380 T 600 380 L 600 600 L 0 600 Z" fill="#041420" opacity="0.8"/>
  
  <!-- Outer Glowing Portal Ring -->
  <circle cx="300" cy="240" r="165" fill="none" stroke="url(#accent_heshm)" stroke-width="3.5" opacity="0.8" filter="url(#glow)"/>
  <circle cx="300" cy="240" r="150" fill="#0A1D2D" stroke="#1E3A52" stroke-width="2"/>
  
  <!-- Specialist Visual Illustration -->
  
        <!-- Hijab & Niqab Headpiece -->
        <path d="M230 180 C230 110, 370 110, 370 180 C370 230, 360 270, 340 310 L260 310 C240 270, 230 230, 230 180 Z" fill="#0F172A"/>
        <!-- Eyes area opening -->
        <path d="M255 205 Q300 200 345 205 Q345 225 300 225 Q255 225 255 205 Z" fill="#FDE047" opacity="0.25"/>
        <ellipse cx="278" cy="214" rx="14" ry="8" fill="#F8FAFC"/>
        <circle cx="278" cy="214" r="4" fill="#0F172A"/>
        <ellipse cx="322" cy="214" rx="14" ry="8" fill="#F8FAFC"/>
        <circle cx="322" cy="214" r="4" fill="#0F172A"/>
        
        <!-- Niqab veil covering lower face -->
        <path d="M245 230 Q300 235 355 230 L360 320 Q300 330 240 320 Z" fill="#1E293B"/>
        <!-- White Doctor Lab Coat -->
        <path d="M190 380 C190 315, 230 295, 300 295 C370 295, 410 315, 410 380 Z" fill="#FFFFFF"/>
        <path d="M280 295 L300 345 L320 295 Z" fill="#0F172A"/>
        <!-- Stethoscope & Lapel -->
        <path d="M255 315 L285 380 L300 380" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"/>
        <path d="M345 315 L315 380 L300 380" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"/>
        
  
  <!-- Badge & Name Section -->
  <rect x="80" y="430" width="440" height="135" rx="24" fill="#061624" fill-opacity="0.9" stroke="#1E3A52" stroke-width="1.5"/>
  
  <!-- Name in Glowing Yellow Calligraphy -->
  <text x="300" y="478" font-family="'Almarai', 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="900" fill="#FBBF24" text-anchor="middle" letter-spacing="0.5">حشمة المطيري</text>
  
  <!-- Specialty Pill Badge -->
  <rect x="130" y="500" width="340" height="40" rx="20" fill="#0B3B36" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="300" y="526" font-family="'Almarai', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">المدير الإداري لفرع الربوة</text>
  
  <!-- RABA Center Watermark -->
  <text x="540" y="45" font-family="sans-serif" font-size="14" font-weight="bold" fill="#00E5BE" opacity="0.5" text-anchor="end">RABA CENTER</text>
</svg>