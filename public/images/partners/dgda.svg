<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" fill="none">
  <g transform="translate(170, 170)">
    <!-- Outer Circular Seal in Heritage Green -->
    <circle cx="0" cy="0" r="148" fill="#FFFFFF" stroke="#006B4D" stroke-width="4" />
    <circle cx="0" cy="0" r="142" fill="none" stroke="#006B4D" stroke-width="1.5" />
    
    <!-- Geometric Triangle Pattern Around Rim -->
    <circle cx="0" cy="0" r="112" fill="none" stroke="#006B4D" stroke-width="2" />
    <circle cx="0" cy="0" r="134" fill="none" stroke="#006B4D" stroke-width="1" stroke-dasharray="3,3" />
    
    <!-- 24 Distinctive Najdi Heritage Triangles on the Border -->
    <g fill="none" stroke="#006B4D" stroke-width="2.5" stroke-linejoin="round">
      <polygon points="0,-142 8,-122 -8,-122" />
      <polygon points="36,-137 42,-117 26,-121" />
      <polygon points="71,-123 72,-103 57,-110" />
      <polygon points="100,-100 96,-80 84,-90" />
      <polygon points="123,-71 114,-53 105,-66" />
      <polygon points="137,-36 123,-21 118,-37" />
      <polygon points="142,0 124,10 124,-10" />
      <polygon points="137,36 118,37 123,21" />
      <polygon points="123,71 105,66 114,53" />
      <polygon points="100,100 84,90 96,80" />
      <polygon points="71,123 57,110 72,103" />
      <polygon points="36,137 26,121 42,117" />
      <polygon points="0,142 -8,122 8,122" />
      <polygon points="-36,137 -42,117 -26,121" />
      <polygon points="-71,123 -72,103 -57,110" />
      <polygon points="-100,100 -96,80 -84,90" />
      <polygon points="-123,71 -114,53 -105,66" />
      <polygon points="-137,36 -123,21 -118,37" />
      <polygon points="-142,0 -124,-10 -124,10" />
      <polygon points="-137,-36 -118,-37 -123,-21" />
      <polygon points="-123,-71 -105,-66 -114,-53" />
      <polygon points="-100,-100 -84,-90 -96,-80" />
      <polygon points="-71,-123 -57,-110 -72,-103" />
      <polygon points="-36,-137 -26,-121 -42,-117" />
    </g>

    <!-- Top Curved Text: هيئة تطوير بوابة الدرعية -->
    <path id="dgdaTextArc" d="M-90 -55 C-55 -105, 55 -105, 90 -55" fill="none" />
    <text font-family="'Tajawal', 'Cairo', 'Segoe UI', sans-serif" font-weight="900" font-size="18" fill="#006B4D">
      <textPath href="#dgdaTextArc" startOffset="50%" text-anchor="middle">
        هيئة تطوير بوابة الدرعية
      </textPath>
    </text>

    <!-- Center: At-Turaif Mud Palace & Heritage Fort Silhouette -->
    <!-- Palm Tree with Crossed Swords Top -->
    <g transform="translate(0, -35) scale(0.65)">
      <path d="M-1.5 -18 L1.5 -18 L1.5 5 L-1.5 5 Z" fill="#006B4D" />
      <path d="M0 -18 C-6 -26, -14 -24, -16 -18 C-10 -20, -3 -16, 0 -18 Z" fill="#006B4D" />
      <path d="M0 -18 C6 -26, 14 -24, 16 -18 C10 -20, 3 -16, 0 -18 Z" fill="#006B4D" />
      <path d="M0 -12 C-8 -18, -16 -10, -12 -2 C-6 -6, -2 -8, 0 -12 Z" fill="#006B4D" />
      <path d="M0 -12 C8 -18, 16 -10, 12 -2 C6 -6, 2 -8, 0 -12 Z" fill="#006B4D" />
      <path d="M-12 6 Q0 11 12 15 L11 17 Q0 13 -11 8 Z" fill="#006B4D" />
      <path d="M12 6 Q0 11 -12 15 L-11 17 Q0 13 11 8 Z" fill="#006B4D" />
    </g>

    <!-- Mud Fort Buildings with distinctive Najdi triangular window slits -->
    <path d="M-55 18 L-55 6 C-55 2, -45 -2, -35 2 L-35 -10 C-35 -14, -20 -18, -10 -14 L0 -14 C10 -18, 25 -14, 25 -10 L35 0 C45 -4, 55 0, 55 6 L55 18 Z" fill="none" stroke="#006B4D" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Triangular triangular window slits in walls -->
    <circle cx="-35" cy="8" r="1.5" fill="#006B4D" />
    <circle cx="-15" cy="-2" r="1.5" fill="#006B4D" />
    <circle cx="25" cy="4" r="1.5" fill="#006B4D" />

    <!-- Water waves / horizontal ridges below palace -->
    <line x1="-50" y1="23" x2="50" y2="23" stroke="#006B4D" stroke-width="2" />
    <line x1="-45" y1="28" x2="45" y2="28" stroke="#006B4D" stroke-width="2" />
    <line x1="-40" y1="33" x2="40" y2="33" stroke="#006B4D" stroke-width="1.5" />
    <line x1="-30" y1="38" x2="30" y2="38" stroke="#006B4D" stroke-width="1.5" />
  </g>
</svg>
