<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" fill="none">
  <!-- Right: Official Seal of MNGHA -->
  <g transform="translate(340, 110) scale(0.9)">
    <!-- White outer background circle with shadow -->
    <circle cx="0" cy="0" r="54" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Red outer circle ribbon -->
    <circle cx="0" cy="0" r="48" fill="#B91C1C" />
    <circle cx="0" cy="0" r="40" fill="#FFFFFF" />
    
    <!-- Central Crest Elements -->
    <!-- Green Wreath -->
    <path d="M-28 6 C-32 -14, -18 -30, 0 -34 C18 -30, 32 -14, 28 6" stroke="#15803D" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Golden Crown Top -->
    <path d="M-10 -26 L-14 -18 L-5 -19 L0 -24 L5 -19 L14 -18 L10 -26 Z" fill="#EAB308" stroke="#CA8A04" stroke-width="1" />
    <!-- Military Armored Symbol / Vehicle in Center -->
    <rect x="-14" y="-8" width="28" height="16" rx="4" fill="#65A30D" />
    <line x1="-12" y1="-8" x2="12" y2="8" stroke="#4D7C0F" stroke-width="2" />
    <circle cx="-6" cy="8" r="3" fill="#1F2937" />
    <circle cx="6" cy="8" r="3" fill="#1F2937" />
    <!-- Red banner below -->
    <path d="M-34 22 Q0 30 34 22 L30 34 Q0 40 -30 34 Z" fill="#991B1B" />
    <path d="M-34 22 L-42 16 L-38 32 L-30 34 Z" fill="#7F1D1D" />
    <path d="M34 22 L42 16 L38 32 L30 34 Z" fill="#7F1D1D" />
  </g>

  <!-- Left: Official Typography -->
  <g transform="translate(155, 65)">
    <text x="0" y="24" text-anchor="middle" font-family="'Tajawal', 'Cairo', 'Segoe UI', sans-serif" font-weight="900" font-size="26" fill="#0F172A">وزارة الحرس الوطني</text>
    <text x="0" y="60" text-anchor="middle" font-family="'Tajawal', 'Cairo', 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#1E293B">الشـؤون الـصـحـيـة</text>
    <text x="0" y="86" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="11" fill="#475569" letter-spacing="0.2">Ministry of National Guard Health Affairs</text>
    <text x="0" y="112" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="16" fill="#0F172A" letter-spacing="3">M N G H A</text>
  </g>
</svg>
