<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" fill="none">
  <g transform="translate(170, 170)">
    <!-- Terracotta / Heritage Brick Brown Circle Seal -->
    <circle cx="0" cy="0" r="148" fill="#FFFFFF" stroke="#9A3412" stroke-width="3.5" />
    <circle cx="0" cy="0" r="142" fill="none" stroke="#9A3412" stroke-width="1.5" />
    <circle cx="0" cy="0" r="114" fill="none" stroke="#9A3412" stroke-width="2" />

    <!-- Najdi Triangular Border around Rim -->
    <g fill="none" stroke="#9A3412" stroke-width="2.5" stroke-linejoin="round">
      <polygon points="0,-142 7,-124 -7,-124" />
      <polygon points="36,-137 42,-119 26,-123" />
      <polygon points="71,-123 72,-105 57,-112" />
      <polygon points="100,-100 96,-82 84,-92" />
      <polygon points="123,-71 114,-55 105,-68" />
      <polygon points="137,-36 123,-23 118,-39" />
      <polygon points="142,0 124,9 124,-9" />
      <polygon points="137,36 118,39 123,23" />
      <polygon points="123,71 105,68 114,55" />
      <polygon points="100,100 84,92 96,82" />
      <polygon points="71,123 57,112 72,105" />
      <polygon points="36,137 26,123 42,119" />
      <polygon points="0,142 -7,124 7,124" />
      <polygon points="-36,137 -42,119 -26,123" />
      <polygon points="-71,123 -72,105 -57,112" />
      <polygon points="-100,100 -96,82 -84,92" />
      <polygon points="-123,71 -114,55 -105,68" />
      <polygon points="-137,36 -123,23 -118,39" />
      <polygon points="-142,0 -124,-9 -124,9" />
      <polygon points="-137,-36 -118,-39 -123,-23" />
      <polygon points="-123,-71 -105,-68 -114,-55" />
      <polygon points="-100,-100 -84,-92 -96,-82" />
      <polygon points="-71,-123 -57,-112 -72,-105" />
      <polygon points="-36,-137 -26,-123 -42,-119" />
    </g>

    <!-- Top Curved Text: شركة الدرعية -->
    <path id="diriyahArArc" d="M-85 -60 C-50 -105, 50 -105, 85 -60" fill="none" />
    <text font-family="'Tajawal', 'Cairo', 'Segoe UI', sans-serif" font-weight="900" font-size="21" fill="#9A3412">
      <textPath href="#diriyahArArc" startOffset="50%" text-anchor="middle">
        شـركـة الـدرعـيـة
      </textPath>
    </text>

    <!-- Bottom Curved Text: Diriyah Company -->
    <path id="diriyahEnArc" d="M-95 65 C-55 110, 55 110, 95 65" fill="none" />
    <text font-family="'Inter', 'Arial', sans-serif" font-weight="800" font-size="16" fill="#9A3412" letter-spacing="0.5">
      <textPath href="#diriyahEnArc" startOffset="50%" text-anchor="middle">
        Diriyah Company
      </textPath>
    </text>

    <!-- Center: At-Turaif Mud-Brick Architecture Silhouette -->
    <!-- Architectural outline of traditional mud citadel -->
    <path d="M-52 16 L-52 4 C-52 0, -42 -4, -32 0 L-32 -14 C-32 -18, -18 -22, -8 -16 L-2 -16 C8 -22, 22 -18, 22 -14 L30 0 C40 -6, 52 -2, 52 4 L52 16 Z" fill="none" stroke="#9A3412" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Najdi triangular windows / ventilation slits -->
    <polygon points="-42,4 -38,10 -46,10" fill="#9A3412" />
    <polygon points="-12,-6 -8,0 -16,0" fill="#9A3412" />
    <polygon points="12,-4 16,2 8,2" fill="#9A3412" />
    <polygon points="38,6 42,12 34,12" fill="#9A3412" />

    <!-- Water waves / horizontal ridges below palace -->
    <line x1="-50" y1="21" x2="50" y2="21" stroke="#9A3412" stroke-width="2" />
    <line x1="-45" y1="26" x2="45" y2="26" stroke="#9A3412" stroke-width="2" />
    <line x1="-40" y1="31" x2="40" y2="31" stroke="#9A3412" stroke-width="1.5" />
    <line x1="-30" y1="36" x2="30" y2="36" stroke="#9A3412" stroke-width="1.5" />
  </g>
</svg>
