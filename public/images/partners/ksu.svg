<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <!-- Sky Blue Background Pill/Rect matching the photo -->
  <rect width="400" height="240" rx="20" fill="#0082C8" />
  
  <!-- Right: Official Shield Emblem -->
  <g transform="translate(305, 115) scale(0.85)">
    <!-- Outer Shield with curved top and pointed base -->
    <path d="M-36 -50 C-10 -58, 10 -58, 36 -50 C38 0, 36 35, 0 65 C-36 35, -38 0, -36 -50 Z" fill="#FFFFFF" />
    <!-- Inner Details in Sky Blue -->
    <!-- Palm Tree & Swords -->
    <path d="M-1.5 -38 L1.5 -38 L1.5 -22 L-1.5 -22 Z" fill="#0082C8" />
    <!-- Fronds -->
    <path d="M0 -38 C-8 -46, -16 -40, -18 -32 C-10 -35, -4 -32, 0 -38 Z" fill="#0082C8" />
    <path d="M0 -38 C8 -46, 16 -40, 18 -32 C10 -35, 4 -32, 0 -38 Z" fill="#0082C8" />
    <path d="M0 -34 C-10 -38, -18 -30, -14 -22 C-8 -26, -2 -28, 0 -34 Z" fill="#0082C8" />
    <path d="M0 -34 C10 -38, 18 -30, 14 -22 C8 -26, 2 -28, 0 -34 Z" fill="#0082C8" />
    <!-- Crossed Swords -->
    <path d="M-14 -18 Q0 -13 14 -8 L13 -6 Q0 -11 -13 -16 Z" fill="#0082C8" />
    <path d="M14 -18 Q0 -13 -14 -8 L-13 -6 Q0 -11 13 -16 Z" fill="#0082C8" />
    <!-- Open Quran / Book -->
    <path d="M-22 5 C-10 0, -2 8, 0 16 C2 8, 10 0, 22 5 C18 18, 10 24, 0 25 C-10 24, -18 18, -22 5 Z" fill="#0082C8" />
    <!-- Year 1957 -->
    <text x="0" y="44" text-anchor="middle" font-family="'Cairo', 'Arial', sans-serif" font-weight="900" font-size="13" fill="#0082C8">1957</text>
  </g>

  <!-- Left: Official Typography in White -->
  <g transform="translate(145, 105)">
    <!-- Arabic Title: جامعة الملك سعود -->
    <text x="0" y="0" text-anchor="middle" font-family="'Tajawal', 'Cairo', 'Segoe UI', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="-0.5">جامـعـة</text>
    <text x="0" y="32" text-anchor="middle" font-family="'Tajawal', 'Cairo', 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF">الملك سعود</text>
    <!-- English Subtitle -->
    <text x="0" y="58" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" letter-spacing="0.5">King Saud University</text>
  </g>
</svg>
