<svg viewBox="0 0 340 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(170, 45)">
    <!-- Delta in English -->
    <text x="-65" y="14" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="36" fill="#1E3A8A">Delta</text>
    <circle cx="-20" cy="-12" r="4" stroke="#16A34A" stroke-width="1" fill="none"/>
    <text x="-20" y="-9" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="6" fill="#16A34A">R</text>
    <!-- Microscope Triangle -->
    <g transform="translate(0, 0)">
      <polygon points="0,-25 -22,15 22,15" fill="none" stroke="#16A34A" stroke-width="4.5" stroke-linejoin="round"/>
      <circle cx="0" cy="-4" r="4" fill="#1E3A8A"/>
      <line x1="-6" y1="6" x2="6" y2="6" stroke="#1E3A8A" stroke-width="3"/>
      <line x1="-12" y1="10" x2="12" y2="10" stroke="#1E3A8A" stroke-width="3"/>
    </g>
    <!-- Delta in Arabic -->
    <text x="65" y="14" text-anchor="middle" font-family="'Tajawal', 'Cairo', sans-serif" font-weight="900" font-size="42" fill="#1E3A8A">دلتـا</text>
  </g>
  <!-- Lower Green Banner -->
  <rect x="30" y="88" width="280" height="28" fill="#84CC16" rx="4"/>
  <text x="170" y="107" text-anchor="middle" font-family="'Tajawal', 'Cairo', sans-serif" font-weight="800" font-size="13" fill="#FFFFFF">مـخـتـبـرات طـبـيـة &nbsp;|&nbsp; Medical Laboratories</text>
</svg>