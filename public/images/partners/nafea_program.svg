<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <g transform="translate(200, 75)">
    <!-- Playful Human Figure with Spreading Colors -->
    <!-- Head -->
    <circle cx="0" cy="-38" r="9" fill="#0EA5E9" />
    <!-- Curved Body -->
    <path d="M-8 -22 C-10 -5, -4 15, 0 25 C4 15, 10 -5, 8 -22 Z" fill="#0EA5E9" />
    <!-- Arms reaching up -->
    <path d="M-8 -18 C-18 -32, -26 -44, -22 -52 C-18 -50, -12 -38, -4 -24 Z" fill="#0284C7" />
    
    <!-- Organic Droplets & Petals Around -->
    <!-- Top-left Green Petal -->
    <path d="M-28 -42 C-40 -40, -44 -18, -34 -6 C-26 -16, -20 -30, -28 -42 Z" fill="#84CC16" />
    <!-- Small Red Dot Left -->
    <circle cx="-38" cy="8" r="4.5" fill="#EF4444" />
    <!-- Yellow Droplet Left Bottom -->
    <path d="M-26 12 C-38 14, -40 28, -26 34 C-18 30, -16 20, -26 12 Z" fill="#EAB308" />
    <!-- Small Yellow Dot Top Right -->
    <circle cx="16" cy="-45" r="3.5" fill="#EAB308" />
    <!-- Small Green Dot Right -->
    <circle cx="34" cy="-28" r="3.5" fill="#84CC16" />
    <!-- Red Tear Right -->
    <path d="M8 8 C14 -8, 32 -6, 32 10 C32 26, 12 36, 8 8 Z" fill="#EF4444" />
  </g>
  
  <!-- Arabic Calligraphic Text "نافع" -->
  <text x="200" y="145" text-anchor="middle" font-family="'Tajawal', 'Cairo', 'Segoe UI', sans-serif" font-weight="900" font-size="34" fill="#0D5C75" letter-spacing="-0.5">نافع</text>
  
  <!-- Wide Subtitle "بـرامـج نـافـع" -->
  <text x="200" y="180" text-anchor="middle" font-family="'Tajawal', 'Cairo', 'Segoe UI', sans-serif" font-weight="800" font-size="22" fill="#E11D48" letter-spacing="4">بـرامـج</text>
  <text x="200" y="212" text-anchor="middle" font-family="'Tajawal', 'Cairo', 'Segoe UI', sans-serif" font-weight="800" font-size="22" fill="#2E5A44" letter-spacing="4">نـافـع</text>
</svg>
