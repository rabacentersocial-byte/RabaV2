    <!-- Diagnostics and error recovery guard -->
    <script>
      window.__rabaReactMounted = false;
      window.dismissSplash = function() {
        window.__rabaReactMounted = true;
      };

      window.showAppError = function(err) {
        var root = document.getElementById('root');
        var errText = (err && (err.message || err.toString())) || 'خطأ غير متوقع';
        if (root && !window.__rabaReactMounted) {
          root.innerHTML = `
            <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #0B1320; font-family: system-ui, -apple-system, sans-serif; direction: rtl; text-align: center; padding: 24px;">
              <div style="max-width: 440px; width: 90%; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 20px; padding: 28px 20px; text-align: center; color: #fff; box-shadow: 0 20px 40px rgba(0,0,0,0.6);">
                <div style="width: 56px; height: 56px; border-radius: 16px; background: rgba(239, 68, 68, 0.15); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; color: #f87171; font-size: 26px;">⚠️</div>
                <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 8px;">مركز رابا للتأهيل ورعاية التوحد</h3>
                <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 20px; line-height: 1.6;">جارٍ تحديث المنصة، يرجى النقر على الزر أدناه لتحديث الصفحة ومتابعة التصفح.</p>
                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                  <button onclick="window.location.reload(true)" style="background: #00E5BE; color: #022c22; font-weight: 700; font-size: 13px; padding: 10px 22px; border: none; border-radius: 9999px; cursor: pointer;">تحديث الصفحة ↻</button>
                  <button onclick="localStorage.clear(); window.location.reload(true)" style="background: rgba(255,255,255,0.1); color: #fff; font-weight: 600; font-size: 13px; padding: 10px 18px; border: 1px solid rgba(255,255,255,0.2); border-radius: 9999px; cursor: pointer;">إعادة تعيين الذاكرة</button>
                </div>
              </div>
            </div>
          `;
        }
      };


      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || (event.error && event.error.message))) || '';
        if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('@vite/client')) {
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return;
        }
        console.warn('[Raba Guard] Window error caught:', event.message || event);
      });
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.toString())) || '';
        if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('@vite/client')) {
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return;
        }
        console.warn('[Raba Guard] Promise rejection caught:', event.reason);
      });

      // Anti-flicker dark/light mode script (splash retains dark contrast to prevent white-on-white invisibility)
      (function() {
        try {
          var saved = localStorage.getItem('raba_theme_v2') || localStorage.getItem('raba_theme');
          var isLight = saved === 'light';
          var root = document.documentElement;
          if (isLight) {
            root.classList.remove('dark');
            root.classList.add('light');
            root.style.colorScheme = 'light';
            root.style.backgroundColor = '#F8FAFC';
          } else {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.colorScheme = 'dark';
            root.style.backgroundColor = '#0D1B2A';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
